# =============================================================================
# TFT 97 — fast regression smoke profile
# =============================================================================
model_type: "tft"
training_mode: "from_scratch"
context_length: 64
forecast_length: 96

hidden_dim: 64
variable_dim: 32
num_heads: 4
dropout_rate: 0.1
num_outputs: 1

lr: 0.001
num_batches_per_epoch: 25
batch_size: 256
max_epochs: 1
early_stopping_patience: 2
gradient_clip_val: 1.0

covariate_cols: []
target_col: "bg_mM"
patient_col: "p_num"
time_col: "datetime"
interval_mins: 5

eval_metric: "WQL"
enable_ensemble: false
imputation_threshold_mins: 45
