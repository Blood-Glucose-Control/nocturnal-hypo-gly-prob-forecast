# =============================================================================
# TimeGrad 97 — fast regression smoke profile
# =============================================================================
model_type: "timegrad"
training_mode: "from_scratch"
context_length: 288
forecast_length: 96
num_epochs: 1

input_features: []
target_features:
  - bg_mM

scaler_type: "standard"
resolution_min: 5
freq: "5T"

diff_steps: 10
beta_end: 0.1
beta_schedule: "linear"
loss_type: "l2"
cell_type: "GRU"
num_cells: 100
num_layers: 2
residual_layers: 8
residual_channels: 8

learning_rate: 1.0e-3
batch_size: 64
num_batches_per_epoch: 10
scaling: true
num_samples: 10
