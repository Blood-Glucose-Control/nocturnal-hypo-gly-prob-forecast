# =============================================================================
# PatchTST 97 — fast regression smoke profile
# =============================================================================
model_type: "patchtst"
training_mode: "from_scratch"
context_length: 256
forecast_length: 96

patch_len: 16
stride: 8
d_model: 128
nhead: 16
num_encoder_layers: 3

lr: 0.0001
weight_decay: 1e-08
num_batches_per_epoch: 25
batch_size: 256
max_epochs: 1
early_stopping_patience: 2

covariate_cols: []
target_col: "bg_mM"
patient_col: "p_num"
time_col: "datetime"
interval_mins: 5

eval_metric: "WQL"
enable_ensemble: false
imputation_threshold_mins: 45
