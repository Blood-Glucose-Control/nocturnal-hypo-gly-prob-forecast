    context_length: 512
    covariate_cols: []
    finetuned_datasets: [lynch_2022, aleppo_2017, brown_2019, tamborlane_2008]
    zeroshot_datasets: []
  - model_config: configs/models/tide/01_bg_iob.yaml
    context_length: 512
    covariate_cols: [iob]
    finetuned_datasets: [lynch_2022, aleppo_2017, brown_2019]
