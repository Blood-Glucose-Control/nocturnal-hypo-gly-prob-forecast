    zeroshot_datasets: []
  - model_config: configs/models/tide/04_large_arch.yaml
    context_length: 512
    covariate_cols: [iob, insulin_availability]
    finetuned_datasets: [lynch_2022, aleppo_2017, brown_2019]
    zeroshot_datasets: []
  - model_config: configs/models/tide/05_bg_iob_ia_high_lr.yaml
    context_length: 512
    covariate_cols: [iob, insulin_availability]
    finetuned_datasets: [lynch_2022, aleppo_2017, brown_2019]
    zeroshot_datasets: []
  - model_config: configs/models/tide/06_bg_iob_ia_short_ctx.yaml
