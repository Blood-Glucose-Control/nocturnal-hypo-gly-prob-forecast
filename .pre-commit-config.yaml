repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=100000
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        exclude: "^docs/source/examples/"
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      # PR-R3 temporary policy: keep Ruff scoped to Python sources, excluding notebooks.
      # Revisit via project_tracking task `notebook-ruff-policy-restore` (P4).
      # `private/` is gitignored scratch/competition tooling; when it is force-added
      # for backup it must not be held to repo lint standards (it never ships).
      - id: ruff
        args: ["--fix", "--select=E4,E7,E9,F,I"]
        types_or: [python, pyi]
        exclude: "^private/"
      - id: ruff-format
        types_or: [python, pyi]
        exclude: "^private/"

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
      - id: pyright
        args: [--project=pyrightconfig.json]
        files: ^((src|tests)/(models|workflows|configs)/.*\.py)$
        exclude: ^src/models/.*/_deprecated/.*\.py$
